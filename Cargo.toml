[package]
name = "corral"
version = "0.2.0"
edition = "2021"
description = "Restrict OpenCode agent file access via firewall rules"
license = "MIT"

[[bin]]
name = "corral"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
